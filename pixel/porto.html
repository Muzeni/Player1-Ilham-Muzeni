<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Porto | Nama Kamu</title>
  <link rel="icon" type="image/png" href="images/web-porto.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #2b3470;
      --panel: #1b1e2e;
      --line: #67e8f9;
      --green: #8be16b;
      --gold: #ffc857;
      --text: #ffffff;
      --muted: #aab3e0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Pixelify Sans", "Courier New", monospace;
      font-size: 18px;
      line-height: 1.6;
      padding: 24px 20px 64px;
    }
    img { image-rendering: auto; display: block; }
    a { color: inherit; }
    :focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
    .wrap { max-width: 1000px; margin: 0 auto; }

    .back { display: inline-block; color: var(--muted); text-decoration: none; margin-bottom: 32px; }
    .back:hover { color: var(--green); }

    header { display: flex; gap: 20px; align-items: center; margin-bottom: 40px; }
    header img { width: 72px; height: 72px; image-rendering: pixelated; background: var(--panel); padding: 8px; flex: none; }
    h1 {
      font-size: 36px; line-height: 1.1; color: var(--green);
      border-left: 6px solid var(--green); padding-left: 12px;
    }
    header p { color: var(--muted); margin-top: 6px; padding-left: 18px; }

    .grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 28px; }
    .card { flex: 0 1 calc((100% - 56px) / 3); min-width: 260px; }

    .card { background: var(--panel); border: 4px dashed var(--line); padding: 16px; }
    .shot {
      position: relative; width: 100%; aspect-ratio: 16 / 10; border: 0; cursor: zoom-in;
      background: repeating-conic-gradient(#232845 0 25%, #1b1e2e 0 50%) 0 0 / 24px 24px;
      display: grid; place-items: center; color: var(--muted); font: inherit; overflow: hidden;
    }
    .shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; }
    .card h2 { font-size: 22px; color: var(--gold); margin-top: 14px; }
    .card p { color: var(--text); font-size: 16px; margin-top: 2px; }
    .visit {
      display: inline-block; margin-top: 12px; padding: 4px 14px;
      border: 3px solid var(--text); text-decoration: none; font-size: 16px;
    }
    .visit:hover { background: var(--green); border-color: var(--green); color: var(--panel); }

    dialog { background: var(--panel); border: 4px solid var(--line); padding: 12px; max-width: min(1100px, 94vw); margin: auto; }
    dialog::backdrop { background: rgba(10, 12, 28, 0.85); }
    dialog img { max-width: 100%; max-height: 80vh; margin: 0 auto; }
    dialog button {
      display: block; margin: 12px 0 0 auto; background: var(--bg); color: var(--text);
      border: 3px solid var(--text); font: inherit; padding: 2px 16px; cursor: pointer;
    }
    dialog button:hover { background: var(--green); color: var(--panel); border-color: var(--green); }

    @media (max-width: 520px) {
      body { font-size: 16px; }
      h1 { font-size: 28px; }
    }
    .ongoing .shot { cursor: default; }
.ongoing .shot img.icon {
  position: static;
  width: 96px;
  height: 96px;
  image-rendering: pixelated;
  object-fit: contain;
}

footer {
  max-width: 1000px;
  margin: 48px auto 0;
  text-align: center;
  color: var(--muted);
  font-size: 15px;
}

  </style>
</head>
<body>
  <main class="wrap">
    <a class="back" href="index.html">&lt; Kembali</a>

    <header>
      <img src="images/web-porto.png" alt="" style="width:72px;height:72px">
      <div>
        <h1>Web Porto</h1>
        <p>Kumpulan website yang pernah aku buat.</p>
      </div>
    </header>

    <!--
      CARA TAMBAH WEB BARU:
      salin satu blok <article class="card"> ... </article>,
      lalu ganti nama gambar, judul, deskripsi, dan link.
    -->
    <div class="grid">

      <article class="card">
        <button class="shot" type="button" data-full="images/web1.png" aria-label="Perbesar foto Website 1">
          <span>Foto web 1</span>
          <img src="images/web1.png" alt="Tampilan Website 1" loading="lazy">
        </button>
        <h2>Web Porto</h2>
        <p>Portonya Mas Ilham.</p>
        <a class="visit" href="index.html" target="_blank" rel="noopener">Buka web</a>
      </article>

       <article class="card ongoing">
        <div class="shot">
          <img class="icon" src="images/ongoing1.png" alt="">
        </div>
          <h2>On-going</h2>
          <p>Lagi dikerjain.</p>
      </article>
      
      <article class="card ongoing">
        <div class="shot">
          <img class="icon" src="images/ongoing1.png" alt="">
        </div>
          <h2>On-going</h2>
          <p>Lagi dikerjain.</p>
      </article>
   
      <article class="card ongoing">
        <div class="shot">
          <img class="icon" src="images/ongoing1.png" alt="">
        </div>
          <h2>On-going</h2>
          <p>Lagi dikerjain.</p>
      </article>

    </div>
  </main>

  <dialog id="viewer">
    <img id="viewerImg" src="" alt="">
    <button type="button" id="closeBtn">Tutup</button>
  </dialog>

  <script>
    // Kalau file foto belum ada, gambar disembunyikan dan tulisan "Foto web X" yang tampil
    document.querySelectorAll('.shot img').forEach(function (img) {
      img.addEventListener('error', function () { img.remove(); });
    });

    var viewer = document.getElementById('viewer');
    var viewerImg = document.getElementById('viewerImg');

    document.querySelectorAll('.shot').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (!btn.querySelector('img')) return;
        viewerImg.src = btn.dataset.full;
        viewer.showModal();
      });
    });

    document.getElementById('closeBtn').addEventListener('click', function () { viewer.close(); });
    viewer.addEventListener('click', function (e) { if (e.target === viewer) viewer.close(); });
  </script>
</body>
</html>

<footer>© 2026 ilham Muzeni. Semua hak dilindungi.</footer>
